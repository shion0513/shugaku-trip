<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>修学旅行プラン</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;background:#f3f5f7;color:#202124}.hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center;background:linear-gradient(145deg,#f5f7fa,#e9edf2)}.card{background:#fff;padding:30px;border-radius:22px;box-shadow:0 18px 50px #0002;width:min(420px,92vw)}input,button{font:inherit}input{width:100%;padding:12px 14px;border:1px solid #d9dde3;border-radius:12px;margin:7px 0 12px;outline:none}input:focus{border-color:#777;box-shadow:0 0 0 3px #0000000b}button{border:0;border-radius:11px;padding:9px 13px;background:#222;color:#fff;cursor:pointer}button:hover{filter:brightness(.95)}button.ghost{background:#fff;color:#333;border:1px solid #d9dde3}.error{color:#d93025;min-height:22px;margin-top:8px}.hint,.muted,.small{color:#6b7280;font-size:12px}.app{height:100vh;display:none}.top{height:58px;background:#fff;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;padding:0 16px;gap:12px}.top h1{font-size:18px;margin:0;font-weight:700}.current{margin-left:auto;font-size:13px;color:#666}.tabs{height:48px;background:#fff;border-bottom:1px solid #e5e7eb;display:flex;padding-left:14px;gap:5px}.tab{background:transparent;color:#777;border-radius:0;border-bottom:3px solid transparent;padding:0 18px}.tab.active{color:#111;border-bottom-color:#222;font-weight:700}.panel{height:calc(100vh - 106px);display:none}.panel.active{display:block}.layout{display:grid;grid-template-columns:minmax(0,1fr) 360px;height:100%}.side{background:#fff;overflow:auto;border-left:1px solid #e5e7eb}.plan-side{max-width:760px;margin:auto;border-left:0;border-right:0}.toolbar{padding:11px;display:flex;gap:7px;position:sticky;top:0;background:#fff;z-index:3;border-bottom:1px solid #eee}.toolbar button{font-size:12px}.item{margin:8px 10px;border:1px solid #e3e5e8;border-radius:15px;background:#fff;padding:11px 12px;cursor:pointer;box-shadow:0 2px 8px #00000008}.item:hover,.item.active{border-color:#bbb}.row{display:flex;align-items:center;gap:9px}.num{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:#222;color:#fff;font-size:12px;font-weight:700}.name{font-weight:700;flex:1}.actions{display:flex;gap:6px;margin-top:9px}.actions button{font-size:11px;padding:7px 9px}.danger{background:#fff;color:#c62828;border:1px solid #f0c7c7}.transfer{margin:0 18px 10px;border-left:2px solid #bbb;padding:7px 12px;color:#555}.transfer-title{font-size:11px;font-weight:700;color:#333}.settings{position:fixed;right:16px;top:66px;background:#fff;width:min(390px,calc(100vw - 32px));padding:18px;border-radius:18px;box-shadow:0 15px 45px #0003;z-index:5000}.settings h3{margin:0 0 10px}.mapwrap{position:relative;height:100%;background:#e8eaed}.map{height:100%;width:100%}.map-loading{position:absolute;z-index:10;top:14px;left:14px;background:#fff;padding:9px 12px;border-radius:12px;box-shadow:0 3px 14px #0002;font-size:12px}.route-panel{position:absolute;z-index:20;left:14px;bottom:14px;width:min(430px,calc(100% - 28px));max-height:58%;overflow:auto;background:#fff;border-radius:18px;box-shadow:0 10px 35px #0003;padding:14px;display:none}.route-panel.show{display:block}.route-head{display:flex;align-items:center;gap:10px}.route-head h3{margin:0;font-size:16px}.route-close{margin-left:auto;background:#f1f3f4;color:#444;border-radius:50%;width:32px;height:32px;padding:0}.route-option{border:1px solid #e2e5e9;border-radius:14px;padding:11px;margin-top:10px;cursor:pointer}.route-option.selected{border-color:#222}.route-summary{display:flex;gap:10px;align-items:center}.route-time{font-weight:800;font-size:17px}.route-duration{font-size:12px;color:#666}.route-steps{margin-top:8px}.step{display:flex;gap:9px;padding:7px 0;border-top:1px solid #f0f1f2;font-size:12px}.step-icon{width:25px;text-align:center}.route-error{color:#b3261e;background:#fff4f2;border-radius:10px;padding:10px;margin-top:10px;font-size:12px}.locbtn{position:absolute;z-index:12;right:14px;bottom:18px;width:44px;height:44px;border-radius:50%;background:#fff;color:#333;box-shadow:0 3px 15px #0003;padding:0;font-size:18px}.legend{font-size:11px;color:#666;margin-top:7px}
@media(max-width:800px){.layout{grid-template-columns:1fr}.side{display:none}.route-panel{left:8px;bottom:8px;width:calc(100% - 16px);max-height:55%}.top h1{font-size:16px}}
</style></head><body>
<div id="login" class="login"><div class="card"><h2>修学旅行サイト</h2><p>パスワードを入力してください。</p><input id="pw" type="password" placeholder="パスワード"><button onclick="login()" style="width:100%">入る</button><div id="err" class="error"></div></div></div>
<div id="app" class="app"><header class="top"><h1 id="title">修学旅行プラン</h1><span id="clock" class="current"></span><button class="ghost" onclick="toggleSettings()">設定</button></header><div class="tabs"><button id="tabPlan" class="tab active" onclick="showTab('plan')">予定</button><button id="tabMap" class="tab" onclick="showTab('map')">地図</button></div>
<div id="planPanel" class="panel active"><div class="side plan-side" style="height:100%"><div class="toolbar"><button onclick="addDest()">＋ 行き先追加</button><button class="ghost" onclick="toggleTransfers()">移動情報</button><button class="ghost" onclick="resetData()">初期化</button></div><div id="planList"></div></div></div>
<div id="mapPanel" class="panel"><div class="layout"><div class="mapwrap"><div id="map" class="map"></div><div id="mapLoading" class="map-loading">地図を準備中…</div><button class="locbtn" onclick="locateMe()" title="現在地">⌖</button><div id="routePanel" class="route-panel"></div></div><aside class="side"><div class="toolbar"><button onclick="addDest()">＋ 行き先追加</button><button class="ghost" onclick="toggleTransfers()">移動情報</button></div><div id="list"></div></aside></div></div></div>
<div id="settings" class="settings hidden"><h3>サイト設定</h3><label>タイトル</label><input id="setTitle"><label>パスワード</label><input id="setPw" type="password"><label>Google Maps APIキー</label><input id="setApi" type="password" placeholder="AIza..."><div class="small">APIキーはGoogle CloudでHTTPリファラー制限を設定してから公開してください。</div><div class="row" style="margin-top:10px"><button onclick="saveSettings()">保存して反映</button><button class="ghost" onclick="toggleSettings()">閉じる</button></div></div>
<script>
const KEY='tripFinalGoogle';
const DEFAULT={title:'修学旅行プラン',password:'1234',apiKey:'',showTransfers:true,destinations:[{id:1,name:'東京ドーム',time:'10:00',note:'集合・出発',lat:35.7056,lng:139.7519},{id:2,name:'浅草寺',time:'14:00',note:'',lat:35.7148,lng:139.7967},{id:3,name:'東京スカイツリー',time:'16:00',note:'',lat:35.7101,lng:139.8107}],transfers:[]};
let data=JSON.parse(localStorage.getItem(KEY)||'null')||JSON.parse(JSON.stringify(DEFAULT));let gmap=null,gmarkers=[],groute=null,locationMarker=null,geoPos=null,googleReady=false;
const $=id=>document.getElementById(id); const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){localStorage.setItem(KEY,JSON.stringify(data))}
function login(){const pw=$('pw').value;if(pw===data.password){localStorage.setItem('tripFinalGoogleLoggedIn','1');$('login').style.display='none';$('app').style.display='block';initApp()}else{$('err').textContent='パスワードが間違っています。';window.open('https://www.youtube.com/watch?v=dQw4w9WgXcQ','_blank','noopener,noreferrer')}}
function initApp(){ $('title').textContent=data.title; tick(); setInterval(tick,1000); render(); if(data.apiKey) loadGoogle(); else $('mapLoading').textContent='設定からGoogle Maps APIキーを入力してください'; }
function autoLogin(){if(localStorage.getItem('tripFinalGoogleLoggedIn')==='1'){loginOpen=false;$('login').style.display='none';$('app').style.display='block';initApp()}}
let loginOpen=true;
function tick(){$('clock').textContent=new Date().toLocaleString('ja-JP',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit'})}
function loadGoogle(){if(window.google?.maps){googleReady=true;initGoogleMap();return}$('mapLoading').textContent='Google Mapsを読み込み中…';window.__initGoogle=()=>{googleReady=true;initGoogleMap()};const s=document.createElement('script');s.src='https://maps.googleapis.com/maps/api/js?key='+encodeURIComponent(data.apiKey)+'&v=weekly&callback=__initGoogle';s.async=true;s.defer=true;s.onerror=()=>{$('mapLoading').textContent='Google Mapsを読み込めません。APIキー・API有効化・請求先を確認してください。'};document.head.appendChild(s)}
function initGoogleMap(){if(gmap)return;gmap=new google.maps.Map($('map'),{center:{lat:35.71,lng:139.78},zoom:13,mapTypeControl:false,streetViewControl:false,fullscreenControl:true,gestureHandling:'greedy'});$('mapLoading').style.display='none';renderMapMarkers();gmap.addListener('click',()=>closeRoutePanel());startLocationWatch()}
function showLocation(p){geoPos={lat:p.coords.latitude,lng:p.coords.longitude};if(!gmap)return; if(locationMarker)locationMarker.setMap(null);locationMarker=new google.maps.Marker({map:gmap,position:geoPos,title:'現在地',icon:{path:google.maps.SymbolPath.CIRCLE,scale:8,fillColor:'#1a73e8',fillOpacity:1,strokeColor:'#fff',strokeWeight:3}})}
let geoWatchId=null;function startLocationWatch(){if(!navigator.geolocation)return;if(geoWatchId!==null)return;geoWatchId=navigator.geolocation.watchPosition(showLocation,()=>{}, {enableHighAccuracy:true,maximumAge:15000,timeout:15000})}
function locateMe(){if(geoPos){gmap?.panTo(geoPos);gmap?.setZoom(16);return}if(navigator.geolocation)navigator.geolocation.getCurrentPosition(showLocation,()=>alert('現在地を取得できませんでした。ブラウザの位置情報を許可してください。'),{enableHighAccuracy:true})}
function render(){renderList('list');renderList('planList')}
function renderList(id){const box=$(id);box.innerHTML='';data.destinations.forEach((d,i)=>{const item=document.createElement('div');item.className='item';item.draggable=true;item.dataset.id=d.id;item.innerHTML='<div class="row"><div class="num">'+(i+1)+'</div><div class="name">'+esc(d.name)+'</div><div class="muted">'+esc(d.time||'時刻未設定')+'</div></div><div class="muted" style="margin-top:5px">'+esc(d.note||'メモなし')+'</div><div class="actions"><button onclick="focusD('+d.id+')">地図</button><button class="ghost" onclick="editD('+d.id+')">編集</button><button class="danger" onclick="delD('+d.id+')">削除</button></div>';
item.addEventListener('click',e=>{if(!e.target.closest('button'))focusD(d.id)});item.addEventListener('dragstart',e=>e.dataTransfer.setData('text/plain',d.id));item.addEventListener('dragover',e=>e.preventDefault());item.addEventListener('drop',e=>{e.preventDefault();reorder(Number(e.dataTransfer.getData('text/plain')),d.id)});box.appendChild(item);if(i<data.destinations.length-1&&data.showTransfers){const t=data.transfers[i]||{};const tr=document.createElement('div');tr.className='transfer';tr.innerHTML='<div class="transfer-title">移動 '+(i+1)+' → '+(i+2)+'</div><div>'+esc(t.type||'移動情報未設定')+(t.line?'・'+esc(t.line):'')+'</div><div class="small">'+esc(t.depart||'--:--')+'発 → '+esc(t.arrive||'--:--')+'着</div><div class="small">'+esc(t.from||d.name)+' → '+esc(t.to||data.destinations[i+1].name)+'</div>';box.appendChild(tr)}})
if(id==='list'&&gmap)renderMapMarkers()}
function renderMapMarkers(){if(!gmap)return;gmarkers.forEach(m=>m.setMap(null));gmarkers=[];data.destinations.forEach((d,i)=>{const m=new google.maps.Marker({map:gmap,position:{lat:d.lat,lng:d.lng},title:d.name,label:{text:String(i+1),color:'#fff',fontWeight:'700'}});m.addListener('click',()=>focusD(d.id));gmarkers.push(m)});if(data.destinations.length>1){if(groute)groute.setMap(null);groute=new google.maps.Polyline({map:gmap,path:data.destinations.map(d=>({lat:d.lat,lng:d.lng})),strokeColor:'#5f6368',strokeOpacity:.55,strokeWeight:3,geodesic:false})}}
function focusD(id){const d=data.destinations.find(x=>x.id===id);if(!d)return;showTab('map');if(gmap){gmap.panTo({lat:d.lat,lng:d.lng});gmap.setZoom(16)}requestTransit(d)}
function showTab(t){$('planPanel').classList.toggle('active',t==='plan');$('mapPanel').classList.toggle('active',t==='map');$('tabPlan').classList.toggle('active',t==='plan');$('tabMap').classList.toggle('active',t==='map');if(t==='map'&&gmap)setTimeout(()=>google.maps.event.trigger(gmap,'resize'),50)}
function closeRoutePanel(){ $('routePanel').classList.remove('show');clearRoute() }
function clearRoute(){if(window.activePolys){activePolys.forEach(p=>p.setMap(null));activePolys=[]}}
let activePolys=[];
function fmtTime(v){if(!v)return'--:--';return new Date(v).toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'})}
function stepHTML(step){const td=step.transit?.details;if(td){const line=td.line||{};const dep=td.departure_stop?.name||'';const arr=td.arrival_stop?.name||'';const depT=td.departure_time?.value;const arrT=td.arrival_time?.value;const icon=line.vehicle?.type==='BUS'?'🚌':'🚃';return '<div class="step"><div class="step-icon">'+icon+'</div><div><b>'+esc(line.name||line.short_name||'公共交通')+'</b><br>'+esc(dep)+' '+fmtTime(depT)+' → '+esc(arr)+' '+fmtTime(arrT)+'<br><span class="small">'+esc(line.agencies?.[0]?.name||'')+'</span></div></div>'}return '<div class="step"><div class="step-icon">🚶</div><div>'+esc(step.instructions||step.html_instructions||'徒歩')+'<br><span class="small">'+esc(step.duration?.text||'')+'</span></div></div>'}
async function requestTransit(dest){
 if(!gmap)return;
 const panel=$('routePanel');panel.classList.add('show');
 panel.innerHTML='<div class="route-head"><h3>'+esc(dest.name)+'</h3><button class="route-close" onclick="closeRoutePanel()">×</button></div><div class="small" style="margin-top:4px">現在時刻から、次の出発時刻も含めて検索中…</div>';
 clearRoute();
 startLocationWatch();
 if(!geoPos){await new Promise(resolve=>navigator.geolocation?.getCurrentPosition(p=>{showLocation(p);resolve()},()=>resolve(),{enableHighAccuracy:true,timeout:7000,maximumAge:15000}));}
 if(!geoPos){panel.innerHTML='<div class="route-head"><h3>'+esc(dest.name)+'</h3><button class="route-close" onclick="closeRoutePanel()">×</button></div><div class="route-error">現在地が取得できないため、公共交通ルートを検索できません。位置情報を許可してください。</div>';return}
 if(!window.google?.maps?.DirectionsService){panel.innerHTML+='<div class="route-error">Google Mapsのルート機能が読み込まれていません。</div>';return}
 const service=new google.maps.DirectionsService();
 const offsets=[0,10,20,30,45,60];
 const searches=offsets.map(min=>new Promise(resolve=>{const depart=new Date(Date.now()+min*60000);service.route({origin:geoPos,destination:{lat:dest.lat,lng:dest.lng},travelMode:google.maps.TravelMode.TRANSIT,provideRouteAlternatives:true,transitOptions:{departureTime:depart},unitSystem:google.maps.UnitSystem.METRIC},(res,status)=>resolve({min,res,status,depart}))}));
 const results=await Promise.all(searches);
 const usable=[];const seen=new Set();
 results.forEach(x=>{if(x.status!=='OK'||!x.res?.routes?.length)return;x.res.routes.forEach((r,idx)=>{const leg=r.legs?.[0];if(!leg)return;const dep=leg.departure_time?.value?.getTime?.()||0;const arr=leg.arrival_time?.value?.getTime?.()||0;const key=(dep||x.depart.getTime())+'|'+(arr||0)+'|'+(r.summary||'');if(!seen.has(key)){seen.add(key);usable.push({r,search:x,idx,leg})}})});
 if(!usable.length){panel.innerHTML='<div class="route-head"><h3>'+esc(dest.name)+'</h3><button class="route-close" onclick="closeRoutePanel()">×</button></div><div class="route-error">現在時刻以降で利用できる公共交通ルートが見つかりませんでした。</div>';return}
 usable.sort((a,b)=>(a.leg.departure_time?.value?.getTime?.()||0)-(b.leg.departure_time?.value?.getTime?.()||0));
 panel.innerHTML='<div class="route-head"><h3>'+esc(dest.name)+'</h3><button class="route-close" onclick="closeRoutePanel()">×</button></div><div class="small" style="margin-top:4px">現在時刻以降の出発時刻を自動検索（最大'+usable.length+'候補）</div>';
 activePolys=[];
 usable.forEach((item,idx)=>{
   const r=item.r,leg=item.leg;const dep=leg.departure_time?.value,arr=leg.arrival_time?.value;
   const opt=document.createElement('div');opt.className='route-option'+(idx===0?' selected':'');
   opt.innerHTML='<div class="route-summary"><div class="route-time">'+fmtTime(dep)+' → '+fmtTime(arr)+'</div><div class="route-duration">'+esc(leg.duration?.text||'')+'</div></div><div class="small">出発予定：'+esc(fmtTime(dep))+'　到着予定：'+esc(fmtTime(arr))+'</div><div class="route-steps">'+(leg.steps||[]).map(stepHTML).join('')+'</div>';
   opt.onclick=()=>{document.querySelectorAll('.route-option').forEach(x=>x.classList.remove('selected'));opt.classList.add('selected');activePolys.forEach(p=>p.setMap(null));activePolys=[];const p=new google.maps.Polyline({map:gmap,path:r.overview_path,strokeColor:'#1a73e8',strokeOpacity:.9,strokeWeight:5});activePolys=[p];if(r.bounds)gmap.fitBounds(r.bounds)};
   panel.appendChild(opt);
   if(idx===0){const p=new google.maps.Polyline({map:gmap,path:r.overview_path,strokeColor:'#1a73e8',strokeOpacity:.9,strokeWeight:5});activePolys.push(p);if(r.bounds)gmap.fitBounds(r.bounds)}
 });
} 
function reorder(fromId,toId){if(fromId===toId)return;const a=data.destinations.findIndex(d=>d.id===fromId),b=data.destinations.findIndex(d=>d.id===toId);const [x]=data.destinations.splice(a,1);data.destinations.splice(b,0,x);data.transfers=data.destinations.slice(0,-1).map((d,i)=>data.transfers[i]||{});save();render()}
async function geocodePlace(name){if(window.google?.maps?.Geocoder){const geocoder=new google.maps.Geocoder();return await new Promise((resolve,reject)=>geocoder.geocode({address:name,region:'JP'},(r,s)=>{if(s==='OK'&&r[0]){const p=r[0].geometry.location;resolve({lat:p.lat(),lng:p.lng()})}else reject(s)}))}const u='https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&accept-language=ja&q='+encodeURIComponent(name);const r=await fetch(u);const a=await r.json();if(!a.length)throw Error('notfound');return{lat:+a[0].lat,lng:+a[0].lon}}
function nowHHMM(){const d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
async function addDest(){const name=prompt('行き先名を入力してください');if(!name)return;try{const p=await geocodePlace(name);data.destinations.push({id:Date.now(),name,time:nowHHMM(),note:'',lat:p.lat,lng:p.lng});data.transfers=data.destinations.slice(0,-1).map((d,i)=>data.transfers[i]||{});save();render();if(gmap){gmap.panTo(p);gmap.setZoom(15)}}catch(e){alert('場所を自動検索できませんでした。駅名・施設名などを具体的に入力してください。')}}
function editD(id){const d=data.destinations.find(x=>x.id===id);if(!d)return;const name=prompt('行き先名',d.name);if(name!==null&&name.trim())d.name=name.trim();const time=prompt('時刻（空欄可）',d.time||'');if(time!==null)d.time=time;const note=prompt('メモ',d.note||'');if(note!==null)d.note=note;save();render();renderMapMarkers()}
function delD(id){if(!confirm('この行き先を削除しますか？'))return;const i=data.destinations.findIndex(x=>x.id===id);data.destinations.splice(i,1);data.transfers=(data.transfers||[]).slice(0,Math.max(0,data.destinations.length-1));save();render();renderMapMarkers()}
function toggleTransfers(){data.showTransfers=!data.showTransfers;save();render()}
function toggleSettings(){$('settings').classList.toggle('hidden');$('setTitle').value=data.title;$('setPw').value=data.password;$('setApi').value=data.apiKey||''}
function saveSettings(){data.title=$('setTitle').value||data.title;data.password=$('setPw').value||data.password;data.apiKey=$('setApi').value.trim();save();$('title').textContent=data.title;$('settings').classList.add('hidden');if(data.apiKey){location.reload()}else{$('mapLoading').textContent='設定からGoogle Maps APIキーを入力してください'}}
function resetData(){if(confirm('初期データに戻しますか？')){data=JSON.parse(JSON.stringify(DEFAULT));save();localStorage.removeItem('tripFinalGoogleLoggedIn');location.reload()}}
window.addEventListener('load',autoLogin);
</script></body></html>
