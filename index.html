e{border-color:#bbb}.row{display:flex;align-items:center;gap:9px}.num{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:#222;color:#fff;font-size:12px;font-weight:700}.name{font-weight:700;flex:1}.actions{display:flex;gap:6px;margin-top:9px}.actions button{font-size:11px;padding:7px 9px}.danger{background:#fff;color:#c62828;border:1px solid #f0c7c7}.transfer{margin:0 18px 10px;border-left:2px solid #bbb;padding:7px 12px;color:#555}.transfer-title{font-size:11px;font-weight:700;color:#333}.settings{position:fixed;right:16px;top:66px;background:#fff;width:min(390px,calc(100vw - 32px));padding:18px;border-radius:18px;box-shadow:0 15px 45px #0003;z-index:5000}.settings h3{margin:0 0 10px}.mapwrap{position:relative;height:100%;background:#e8eaed}.map{height:100%;width:100%}.map-loading{position:absolute;z-index:10;top:14px;left:14px;background:#fff;padding:9px 12px;border-radius:12px;box-shadow:0 3px 14px #0002;font-size:12px}.route-panel{position:absolute;z-index:20;left:12px;top:12px;bottom:12px;width:min(430px,calc(100% - 24px));max-height:none;overflow:auto;background:#fff;border-radius:12px;box-shadow:0 4px 18px #0003;padding:0;display:none}.route-panel::-webkit-scrollbar{width:7px}.route-panel::-webkit-scrollbar-thumb{background:#c8cdd2;border-radius:8px}.route-panel.show{display:block}.route-head{display:flex;align-items:center;gap:10px;padding:14px 14px 8px;position:sticky;top:0;background:#fff;z-index:2;border-bottom:1px solid #eee}.route-head h3{margin:0;font-size:17px}.route-close{margin-left:auto;background:#f1f3f4;color:#444;border-radius:50%;width:32px;height:32px;padding:0}.route-tabs{display:flex;gap:0;margin:0;padding:0 10px;border-bottom:1px solid #e5e7eb;position:sticky;top:55px;background:#fff;z-index:2}.route-tab{flex:1;background:#fff;color:#5f6368;padding:11px 8px;border-radius:0;font-weight:700;border-bottom:3px solid transparent}.route-tab.active{background:#fff;color:#1a73e8;border-bottom-color:#1a73e8}.route-option{border:0;border-bottom:1px solid #e6e8eb;border-left:4px solid transparent;border-radius:0;padding:12px 14px;margin:0;cursor:pointer;background:#fff}.route-option:hover{background:#f8f9fa}.route-option.selected{border-left-color:#1a73e8;background:#f8fbff}.route-summary{display:flex;gap:10px;align-items:baseline}.route-time{font-weight:800;font-size:19px;letter-spacing:.1px}.route-duration{font-size:12px;color:#5f6368}.route-meta{display:flex;gap:10px;align-items:center;margin-top:4px;color:#5f6368;font-size:12px}.route-fare{font-weight:700;color:#202124}.route-frequency{color:#188038}.route-intro{padding:9px 14px;color:#5f6368;font-size:11px;border-bottom:1px solid #eee}.route-steps{margin-top:9px;padding-left:3px}.step{display:flex;gap:9px;padding:8px 0;border-top:1px solid #f0f1f2;font-size:12px;position:relative}.step-icon{width:25px;text-align:center;flex:none}.transit-step{padding-left:0}.timeline-dot{width:12px;height:12px;border-radius:50%;border:3px solid #1a73e8;background:#fff;margin:2px auto}.line-badge{border-left:5px solid #5f6368;padding-left:8px;margin-bottom:3px}.line-short{display:inline-block;margin-left:6px;font-size:11px;color:#5f6368}.walk-step{color:#4a4a4a}.route-station{font-size:12px;color:#202124}.route-action{font-size:11px;color:#5f6368;margin-top:2px}.route-error{color:#b3261e;background:#fff4f2;border-radius:10px;padding:10px;margin-top:10px;font-size:12px}.locbtn{position:absolute;z-index:12;right:14px;bottom:18px;width:44px;height:44px;border-radius:50%;background:#fff;color:#333;box-shadow:0 3px 15px #0003;padding:0;font-size:18px}.legend{font-size:11px;color:#666;margin-top:7px}.diag{background:#f7f8fa;border:1px solid #e1e4e8;border-radius:10px;padding:9px;margin-top:9px;font-size:11px;white-space:pre-wrap;word-break:break-word}.ok{color:#137333}.warn{color:#b06000}

</style></head><body>
<div id="login" class="login"><div class="card"><h2>修学旅行サイト</h2><p>パスワードを入力してください。</p><input id="pw" type="password" placeholder="パスワード"><button onclick="login()" style="width:100%">入る</button><div id="err" class="error"></div></div></div>
<div id="app" class="app"><header class="top"><h1 id="title">修学旅行プラン</h1><span id="clock" class="current"></span><button class="ghost" onclick="toggleSettings()">設定</button></header><div class="tabs"><button id="tabPlan" class="tab active" onclick="showTab('plan')">予定</button><button id="tabMap" class="tab" onclick="showTab('map')">地図</button></div>
<div id="planPanel" class="panel active"><div class="side plan-side" style="height:100%"><div class="toolbar"><button onclick="addDest()">＋ 行き先追加</button><button class="ghost" onclick="toggleTransfers()">移動情報</button><button class="ghost" onclick="resetData()">初期化</button></div><div id="planList"></div></div></div>
<div id="mapPanel" class="panel"><div class="layout"><div class="mapwrap"><div id="map" class="map"></div><div id="mapLoading" class="map-loading">地図を準備中…</div><button class="locbtn" onclick="locateMe()" title="現在地">⌖</button><div id="routePanel" class="route-panel"></div></div><aside class="side"><div class="toolbar"><button onclick="addDest()">＋ 行き先追加</button><button class="ghost" onclick="toggleTransfers()">移動情報</button></div><div id="list"></div></aside></div></div></div>
<div id="settings" class="settings hidden"><h3>サイト設定</h3><label>タイトル</label><input id="setTitle"><label>パスワード</label><input id="setPw" type="password"><label>Google Maps APIキー</label><input id="setApi" type="password" placeholder="AIza..."><div class="small">APIキーはGoogle CloudでHTTPリファラー制限を設定してから公開してください。</div><div class="row" style="margin-top:10px"><button onclick="saveSettings()">保存して反映</button><button class="ghost" onclick="toggleSettings()">閉じる</button></div></div>
<script>
const KEY='tripFinalGoogle';
const DEFAULT={title:'修学旅行プラン',password:'1234',apiKey:'',showTransfers:true,destinations:[{id:1,name:'東京ドーム',time:'10:00',note:'集合・出発',lat:35.7056,lng:139.7519},{id:2,name:'浅草寺',time:'14:00',note:'',lat:35.7148,lng:139.7967},{id:3,name:'東京スカイツリー',time:'16:00',note:'',lat:35.7101,lng:139.8107}],transfers:[]};
let data=JSON.parse(localStorage.getItem(KEY)||'null')||JSON.parse(JSON.stringify(DEFAULT));let gmap=null,gmarkers=[],groute=null,locationMarker=null,geoPos=null,googleReady=false;
const $=id=>document.getElementById(id); const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){localStorage.setItem(KEY,JSON.stringify(data))}
function login(){const pw=$('pw').value;if(pw===data.password){localStorage.setItem('tripFinalGoogleLoggedIn','1');$('login').style.display='none';$('app').style.display='block';initApp()}else{$('err').textContent='パスワードが間違っています。';window.open('https://www.youtube.com/watch?v=dQw4w9WgXcQ','_blank','noopener,noreferrer')}}
function initApp(){ $('title').textContent=data.title; tick(); setInterval(tick,1000); render(); if(data.apiKey) loadGoogle(); else $('mapLoading').textContent='設定からGoogle Maps APIキーを入力してください'; }
function autoLogin(){if(localStorage.getItem('tripFinalGoogleLoggedIn')==='1'){loginOpen=false;$('login').style.display='none';$('app').style.display='block';initApp()}}
let loginOpen=true;
function tick(){$('clock').textContent=new Date().toLocaleString('ja-JP',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit'})}
function loadGoogle(){if(window.google?.maps){googleReady=true;initGoogleMap();return}$('mapLoading').textContent='Google Mapsを読み込み中…';window.__initGoogle=()=>{googleReady=true;initGoogleMap()};const s=document.createElement('script');s.src='https://maps.googleapis.com/maps/api/js?key='+encodeURIComponent(data.apiKey)+'&v=weekly&loading=async&libraries=geocoding,places,routes&region=JP&language=ja&callback=__initGoogle';s.async=true;s.defer=true;s.onerror=()=>{$('mapLoading').textContent='Google Mapsを読み込めません。APIキー・API有効化・請求先を確認してください。'};document.head.appendChild(s)}
function initGoogleMap(){if(gmap)return;gmap=new google.maps.Map($('map'),{center:{lat:35.71,lng:139.78},zoom:13,mapTypeControl:false,streetViewControl:false,fullscreenControl:true,gestureHandling:'greedy'});$('mapLoading').style.display='none';renderMapMarkers();gmap.addListener('click',()=>closeRoutePanel());startLocationWatch()}
function showLocation(p){geoPos={lat:p.coords.latitude,lng:p.coords.longitude};if(!gmap)return; if(locationMarker)locationMarker.setMap(null);locationMarker=new google.maps.Marker({map:gmap,position:geoPos,title:'現在地',icon:{path:google.maps.SymbolPath.CIRCLE,scale:8,fillColor:'#1a73e8',fillOpacity:1,strokeColor:'#fff',strokeWeight:3}})}
let geoWatchId=null;function startLocationWatch(){if(!navigator.geolocation)return;if(geoWatchId!==null)return;geoWatchId=navigator.geolocation.watchPosition(showLocation,()=>{}, {enableHighAccuracy:true,maximumAge:15000,timeout:15000})}
function locateMe(){if(geoPos){gmap?.panTo(geoPos);gmap?.setZoom(16);return}if(navigator.geolocation)navigator.geolocation.getCurrentPosition(showLocation,()=>alert('現在地を取得できませんでした。ブラウザの位置情報を許可してください。'),{enableHighAccuracy:true})}
function render(){renderList('list');renderList('planList')}
function renderList(id){const box=$(id);box.innerHTML='';data.destinations.forEach((d,i)=>{const item=document.createElement('div');item.className='item';item.draggable=true;item.dataset.id=d.id;item.innerHTML='<div class="row"><div class="num">'+(i+1)+'</div><div class="name">'+esc(d.name)+'</div><div class="muted">'+esc(d.time||'時刻未設定')+'</div></div><div class="muted" style="margin-top:5px">'+esc(d.note||'メモなし')+'</div><div class="actions"><button onclick="focusD('+d.id+')">地図</button><button class="ghost" onclick="editD('+d.id+')">編集</button><button class="danger" onclick="delD('+d.id+')">削除</button></div>';
item.addEventListener('click',e=>{if(!e.target.closest('button'))focusD(d.id)});item.addEventListener('dragstart',e=>e.dataTransfer.setData('text/plain',d.id));item.addEventListener('dragover',e=>e.preventDefault());item.addEventListener('drop',e=>{e.preventDefault();reorder(Number(e.dataTransfer.getData('text/plain')),d.id)});box.appendChild(item);if(i<data.destinations.length-1&&data.showTransfers){const t=data.transfers[i]||{};const tr=document.createElement('div');tr.className='transfer';tr.innerHTML='<div class="transfer-title">移動 '+(i+1)+' → '+(i+2)+'</div><div>'+esc(t.type||'移動情報未設定')+(t.line?'・'+esc(t.line):'')+'</div><div class="small">'+esc(t.depart||'--:--')+'発 → '+esc(t.arrive||'--:--')+'着</div><div class="small">'+esc(t.from||d.name)+' → '+esc(t.to||data.destinations[i+1].name)+'</div>';box.appendChild(tr)}})
if(id==='list'&&gmap)renderMapMarkers()}
function renderMapMarkers(){if(!gmap)return;gmarkers.forEach(m=>m.setMap(null));gmarkers=[];data.destinations.forEach((d,i)=>{const m=new google.maps.Marker({map:gmap,position:{lat:d.lat,lng:d.lng},title:d.name,label:{text:String(i+1),color:'#fff',fontWeight:'700'}});m.addListener('click',()=>focusD(d.id));gmarkers.push(m)});if(data.destinations.length>1){if(groute)groute.setMap(null);groute=new google.maps.Polyline({map:gmap,path:data.destinations.map(d=>({lat:d.lat,lng:d.lng})),strokeColor:'#5f6368',strokeOpacity:.55,strokeWeight:3,geodesic:false})}}
function focusD(id){const d=data.destinations.find(x=>x.id===id);if(!d)return;showTab('map');if(gmap){gmap.panTo({lat:d.lat,lng:d.lng});gmap.setZoom(16)}requestTransit(d)}
function showTab(t){$('planPanel').classList.toggle('active',t==='plan');$('mapPanel').classList.toggle('active',t==='map');$('tabPlan').classList.toggle('active',t==='plan');$('tabMap').classList.toggle('active',t==='map');if(t==='map'&&gmap)setTimeout(()=>google.maps.event.trigger(gmap,'resize'),50)}
function closeRoutePanel(){ $('routePanel').classList.remove('show');clearRoute() }
function clearRoute(){if(window.activePolys){activePolys.forEach(p=>p.setMap(null));activePolys=[]}}
let activePolys=[];
function fmtTime(v){if(!v)return'--:--';return new Date(v).toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'})}
function stepHTML(step){const td=step.transit?.details;if(td){const line=td.line||{};const dep=td.departure_stop?.name||'';const arr=td.arrival_stop?.name||'';const depT=td.departure_time?.value;const arrT=td.arrival_time?.value;const icon=line.vehicle?.type==='BUS'?'🚌':'🚃';return '<div class="step"><div class="step-icon">'+icon+'</div><div><b>'+esc(line.name||line.short_name||'公共交通')+'</b><br>'+esc(dep)+' '+fmtTime(depT)+' → '+esc(arr)+' '+fmtTime(arrT)+'<br><span class="small">'+esc(line.agencies?.[0]?.name||'')+'</span></div></div>'}return '<div class="step"><div class="step-icon">🚶</div><div>'+esc(step.instructions||step.html_instructions||'徒歩')+'<br><span class="small">'+esc(step.duration?.text||'')+'</span></div></div>'}
async function requestTransit(dest){
 if(!gmap)return;
 const panel=$('routePanel');panel.classList.add('show');clearRoute();startLocationWatch();
 panel.innerHTML='<div class="route-head"><h3>'+esc(dest.name)+'</h3><button class="route-close" onclick="closeRoutePanel()">×</button></div><div class="route-tabs"><button id="rtWalk" class="route-tab" onclick="switchRouteMode(\'walk\',\''+dest.id+'\')">🚶 徒歩</button><button id="rtTransit" class="route-tab active" onclick="switchRouteMode(\'transit\',\''+dest.id+'\')">🚃 公共交通機関</button></div><div id="routeContent"><div class="small">現在地を確認して検索中…</div></div>';
 window.currentRouteDest=dest; window.currentRouteMode='transit';
 await ensureGeo();
 if(!geoPos){$('routeContent').innerHTML='<div class="route-error">現在地が取得できません。ブラウザの位置情報を許可してください。</div>';return;}
 await searchRouteMode('transit',dest);
}
async function ensureGeo(){
 if(geoPos)return;
 if(!navigator.geolocation)return;
 await new Promise(resolve=>navigator.geolocation.getCurrentPosition(p=>{showLocation(p);resolve()},()=>resolve(),{enableHighAccuracy:true,timeout:8000,maximumAge:15000}));
}
async function switchRouteMode(mode,id){
 const dest=data.destinations.find(d=>String(d.id)===String(id));if(!dest)return;
 window.currentRouteMode=mode;
 $('rtWalk')?.classList.toggle('active',mode==='walk');$('rtTransit')?.classList.toggle('active',mode==='transit');
 await ensureGeo(); if(!geoPos){$('routeContent').innerHTML='<div class="route-error">現在地が取得できません。位置情報を許可してください。</div>';return;}
 await searchRouteMode(mode,dest);
}
function routeFields(){return ['path','legs','localizedValues','viewport','routeLabels','travelAdvisory'];}
function routeTime(v){return v instanceof Date?v:(v?.toDate?v.toDate():new Date(v));}
function routeStepInfo(step){
 const td=step.transitDetails;
 if(td){
  const line=td.transitLine||{}; const dep=td.departureStop?.name||''; const arr=td.arrivalStop?.name||'';
  const depT=routeTime(td.departureTime),arrT=routeTime(td.arrivalTime); const vehicle=line.vehicle?.type||'';
  const icon=vehicle==='BUS'?'🚌':(vehicle==='SUBWAY'?'🚇':(vehicle==='TRAM'?'🚊':'🚃'));
  const color=line.color||'#5f6368';
  return {html:'<div class="step transit-step"><div class="step-icon">'+icon+'</div><div><div class="line-badge" style="border-left-color:'+esc(color)+'"><b>'+esc(line.name||line.nameShort||'公共交通')+'</b>'+(line.nameShort?'<span class="line-short">'+esc(line.nameShort)+'</span>':'')+'</div><div class="route-station">'+esc(dep)+' <b>'+fmtTime(depT)+'</b> → '+esc(arr)+' <b>'+fmtTime(arrT)+'</b></div>'+(td.headsign?'<div class="route-action">方面：'+esc(td.headsign)+'</div>':'')+(td.stopCount!=null?'<div class="route-action">'+esc(String(td.stopCount))+'駅・停留所</div>':'')+'</div></div>',color};
 }
 return {html:'<div class="step walk-step"><div class="step-icon">🚶</div><div><b>徒歩</b> '+esc(step.instructions||'徒歩区間')+'<br><span class="small">'+esc(step.localizedValues?.staticDuration||formatMillis(step.staticDurationMillis))+'</span></div></div>',color:'#1a73e8'};
}
function legacyStepInfo(step){
 const td=step.transit?.details;
 if(td){
  const line=td.line||{}; const dep=td.departure_stop?.name||''; const arr=td.arrival_stop?.name||'';
  const depT=td.departure_time?.value||td.departure_time; const arrT=td.arrival_time?.value||td.arrival_time;
  const vt=line.vehicle?.type||''; const icon=vt==='BUS'?'🚌':(vt==='SUBWAY'?'🚇':(vt==='TRAM'?'🚊':'🚃'));
  const color=line.color||'#1a73e8';
  return {html:'<div class="step transit-step"><div class="step-icon">'+icon+'</div><div><div class="line-badge" style="border-left-color:'+esc(color)+'"><b>'+esc(line.name||line.short_name||'公共交通')+'</b>'+(line.short_name?'<span class="line-short">'+esc(line.short_name)+'</span>':'')+'</div><div class="route-station">'+esc(dep)+' <b>'+fmtTime(depT)+'</b> → '+esc(arr)+' <b>'+fmtTime(arrT)+'</b></div>'+(td.headsign?'<div class="route-action">方面：'+esc(td.headsign)+'</div>':'')+(td.num_stops!=null?'<div class="route-action">'+esc(String(td.num_stops))+'駅・停留所</div>':'')+'</div></div>',color};
 }
 return {html:'<div class="step walk-step"><div class="step-icon">🚶</div><div><b>徒歩</b> '+esc(step.instructions||step.html_instructions||'徒歩')+'<br><span class="small">'+esc(step.duration?.text||'')+'</span></div></div>',color:'#1a73e8'};
}
function formatMillis(ms){if(!ms)return'';return Math.max(1,Math.round(ms/60000))+'分';}
function renderRouteSteps(route,legacy=false){const steps=legacy?(route.legs||[]).flatMap(l=>l.steps||[]):(route.legs?.flatMap(l=>l.steps||[])||[]);return steps.map(legacy?legacyStepInfo:routeStepInfo).map(x=>x.html).join('');}
function legacyRouteTimes(route){
 const steps=(route.legs||[]).flatMap(l=>l.steps||[]); const transit=steps.filter(s=>s.transit?.details);
 if(!transit.length)return {dep:null,arr:null};
 return {dep:transit[0].transit.details.departure_time?.value||transit[0].transit.details.departure_time,arr:transit[transit.length-1].transit.details.arrival_time?.value||transit[transit.length-1].transit.details.arrival_time};
}
function routeSummary(route,legacy=false){
 const legs=route.legs||[]; const fare=legacy?route.fare?.text:''; const duration=legacy?legs.reduce((n,l)=>n+(l.duration?.value||0),0):route.durationMillis; const time=legacy?legacyRouteTimes(route):(()=>{const ss=legs.flatMap(l=>l.steps||[]).filter(s=>s.transitDetails);return {dep:ss[0]?.transitDetails?.departureTime,arr:ss.at(-1)?.transitDetails?.arrivalTime}})();
 const lines=legacy?(legs.flatMap(l=>l.steps||[]).map(s=>s.transit?.details?.line).filter(Boolean)):(legs.flatMap(l=>l.steps||[]).map(s=>s.transitDetails?.transitLine).filter(Boolean));
 const lineNames=[...new Set(lines.map(l=>l.name||l.short_name||l.nameShort).filter(Boolean))];
 return {dep:time.dep,arr:time.arr,duration:legacy?Math.max(1,Math.round(duration/60))+'分':(route.localizedValues?.duration||formatMillis(duration)),fare,lines:lineNames};
}
async function drawSelectedRoute(route){
 clearRoute();
 try{
  if(route.__legacy){
   const polys=[];
   (route.legs||[]).forEach(leg=>(leg.steps||[]).forEach(step=>{
    const td=step.transit?.details; const path=step.path||[]; if(!path.length)return;
    if(td){const color=td.line?.color||'#1a73e8';polys.push(new google.maps.Polyline({map:gmap,path,strokeColor:color,strokeOpacity:.95,strokeWeight:6,zIndex:8}));}
    else {polys.push(new google.maps.Polyline({map:gmap,path,strokeColor:'#1a73e8',strokeOpacity:0,strokeWeight:4,icons:[{icon:{path:google.maps.SymbolPath.CIRCLE,scale:2,strokeColor:'#1a73e8',strokeOpacity:1,fillColor:'#fff',fillOpacity:1},offset:'0',repeat:'12px'}],zIndex:7}));}
   }));
   activePolys=polys; return;
  }
  if(typeof route.createPolylines==='function'){
   const polys=await route.createPolylines({polylineOptions:{strokeOpacity:.9,strokeWeight:5,zIndex:7}});activePolys=polys||[];activePolys.forEach(p=>p.setMap(gmap));
  }else if(route.path){activePolys=[new google.maps.Polyline({map:gmap,path:route.path,strokeColor:'#1a73e8',strokeOpacity:.9,strokeWeight:6,zIndex:7})];}
 }catch(e){console.warn('polyline draw failed',e);if(route.path)activePolys=[new google.maps.Polyline({map:gmap,path:route.path,strokeColor:'#1a73e8',strokeOpacity:.9,strokeWeight:6,zIndex:7})];}
 if(route.viewport)gmap.fitBounds(route.viewport,70);
}
async function searchLegacyTransit(offsets,diag){
 // Google Mapsの経路検索に近いDirectionsServiceを優先して使用。
 // transitOptionsは最小限にし、Google側に交通手段の組み合わせを任せる。
 const DirectionsService=google.maps.DirectionsService;
 if(!DirectionsService)throw Error('DirectionsServiceが利用できません。');
 const service=new DirectionsService(); const results=[]; const errors=[];
 for(const min of offsets){
  const departureTime=new Date(Date.now()+min*60000);
  try{
   const request={
    origin:geoPos,
    destination:{lat:Number(window.currentRouteDest.lat),lng:Number(window.currentRouteDest.lng)},
    travelMode:google.maps.TravelMode.TRANSIT,
    provideRouteAlternatives:true,
    transitOptions:{departureTime},
    unitSystem:google.maps.UnitSystem.METRIC
   };
   const res=await service.route(request);
   const routes=res?.routes||[];
   if(!routes.length){
    errors.push((min===0?'現在時刻':min+'分後')+': ZERO_RESULTS（公共交通ルートなし）');
   }
   routes.forEach(r=>{r.__legacy=true;results.push({r,requested:departureTime,min});});
  }catch(e){
   const status=e?.status||e?.code||'';
   errors.push((min===0?'現在時刻':min+'分後')+': '+(status?status+' / ':'')+(e?.message||String(e)));
  }
 }
 diag.push('DirectionsService検索ルート数: '+results.length);
 return {results,errors};
}
function buildTransitOptions(items,content,diag,errors){
 const usable=[];const seen=new Set();
 items.forEach(x=>{const sm=routeSummary(x.r,x.r.__legacy);if(!sm.dep||!sm.arr)return;const key=String(sm.dep)+'|'+String(sm.arr)+'|'+sm.lines.join(',');if(!seen.has(key)){seen.add(key);usable.push({r:x.r,summary:sm});}});
 usable.sort((a,b)=>routeTime(a.summary.dep)-routeTime(b.summary.dep));
 if(!usable.length){let reason='Googleから公共交通ルートが1本も返されませんでした。';if(errors.length)reason+='\n\nAPIからのエラー:\n'+errors.slice(0,6).join('\n');content.innerHTML='<div class="diag"><b>ルート検索の診断</b>\n'+esc(reason)+'</div><div class="diag"><b>確認できた座標</b>\n'+esc(diag.join('\n'))+'</div>';return false;}
 content.innerHTML='<div class="route-intro">現在時刻以降の候補。タップすると選択した経路だけを地図に表示します。</div>';
 usable.slice(0,10).forEach((x,i)=>{
  const opt=document.createElement('div');opt.className='route-option'+(i===0?' selected':'');
  const s=x.summary; const lineText=s.lines.length?s.lines.join(' → '):'公共交通';
  opt.innerHTML='<div class="route-summary"><div class="route-time">'+fmtTime(s.dep)+' → '+fmtTime(s.arr)+'</div><div class="route-duration">'+esc(s.duration)+'</div></div><div class="route-meta">'+(s.fare?'<span class="route-fare">'+esc(s.fare)+'</span>':'')+'<span>'+esc(lineText)+'</span></div><div class="route-steps" style="display:none">'+renderRouteSteps(x.r,!!x.r.__legacy)+'</div>';
  opt.onclick=()=>{document.querySelectorAll('.route-option').forEach(el=>el.classList.remove('selected'));opt.classList.add('selected');document.querySelectorAll('.route-steps').forEach(el=>el.style.display='none');opt.querySelector('.route-steps').style.display='block';drawSelectedRoute(x.r);};
  content.appendChild(opt);
 });
 const first=content.querySelector('.route-option');if(first){first.querySelector('.route-steps').style.display='block';drawSelectedRoute(usable[0].r);}
 return true;
}
async function searchRouteMode(mode,dest){
 const content=$('routeContent');if(!content)return; content.innerHTML='<div class="small route-intro">'+(mode==='walk'?'徒歩ルートを検索中…':'現在時刻以降の公共交通候補を検索中…')+'</div>';clearRoute();const diag=[];
 try{
  if(!geoPos)throw Error('現在地が取得できていません。');
  if(!Number.isFinite(Number(dest.lat))||!Number.isFinite(Number(dest.lng)))throw Error('目的地の緯度・経度がありません。目的地を編集して再検索してください。');
  diag.push('現在地: '+geoPos.lat.toFixed(6)+', '+geoPos.lng.toFixed(6));diag.push('目的地: '+Number(dest.lat).toFixed(6)+', '+Number(dest.lng).toFixed(6));
  const {Route}=await google.maps.importLibrary('routes');
  if(!Route||typeof Route.computeRoutes!=='function')throw Error('Routesライブラリを読み込めません。');
  diag.push('Routes API: 読み込みOK');
  if(mode==='walk'){
   const req={origin:geoPos,destination:{lat:Number(dest.lat),lng:Number(dest.lng)},travelMode:'WALKING',fields:['*']};const result=await Route.computeRoutes(req);const routes=result.routes||[];if(!routes.length)throw Error('徒歩ルートが返されませんでした。');
   const r=routes[0];const s=routeSummary(r,false);content.innerHTML='<div class="route-option selected"><div class="route-summary"><div class="route-time">徒歩</div><div class="route-duration">'+esc(s.duration)+'</div></div><div class="route-steps">'+renderRouteSteps(r)+'</div></div>';drawSelectedRoute(r);return;
  }
  // まずRoutes APIを試すが、ブラウザのHTTPリファラー制限で拒否された場合は即座にDirectionsServiceへ。
  const offsets=[0,8,16,24,32,40]; const results=await Promise.all(offsets.map(async min=>{const departureTime=new Date(Date.now()+min*60000);try{const req={origin:geoPos,destination:{lat:Number(dest.lat),lng:Number(dest.lng)},travelMode:'TRANSIT',departureTime,computeAlternativeRoutes:true,transitPreference:{allowedTransitModes:['BUS','SUBWAY','TRAIN','LIGHT_RAIL','RAIL']},fields:['*']};const result=await Route.computeRoutes(req);return {min,result,error:null};}catch(error){return {min,result:null,error};}}));
  const all=[];const errors=[];results.forEach(x=>{if(x.error){errors.push((x.min===0?'現在時刻':x.min+'分後')+': '+(x.error.message||String(x.error)));return;}const rs=x.result?.routes||[];rs.forEach(r=>all.push({r,requested:new Date(Date.now()+x.min*60000)}));});diag.push('検索候補: '+offsets.map(x=>x===0?'現在':x+'分後').join(' / '));diag.push('Routes APIが返したルート数: '+all.length);if(errors.length)diag.push('一部検索エラー:\n'+errors.slice(0,4).join('\n'));
  // Routes APIが拒否された場合でも、Google Maps JSのDirectionsServiceで検索を継続する。
  if(buildTransitOptions(all,content,diag,errors))return;
  diag.push('Routes APIで候補が得られないため、Google Maps型のDirectionsServiceへ切り替えます。');
  const legacy=await searchLegacyTransit([0,8,16,24,32,40],diag);
  if(buildTransitOptions(legacy.results,content,diag,legacy.errors))return;
  const allErr=errors.concat(legacy.errors);content.innerHTML='<div class="diag"><b>ルート検索の診断</b>\n'+esc('公共交通ルートを取得できませんでした。\n\n'+allErr.slice(0,6).join('\n'))+'</div><div class="diag"><b>確認できた座標</b>\n'+esc(diag.join('\n'))+'</div><div class="small" style="padding:10px 14px">Google Cloudで「Directions API（レガシー）」を有効にし、APIキーのAPI制限にも追加してください。Routes APIがHTTPリファラー制限で拒否されても、こちらが有効なら公共交通検索を続行できます。</div>';
 }catch(e){console.error('Route search diagnostic:',e);content.innerHTML='<div class="diag"><b>ルート検索でエラーが発生しました</b>\n'+esc(e?.message||String(e))+'</div><div class="diag"><b>確認できた情報</b>\n'+esc(diag.join('\n'))+'</div>';
 }
}
function reorder(fromId,toId){if(fromId===toId)return;const a=data.destinations.findIndex(d=>d.id===fromId),b=data.destinations.findIndex(d=>d.id===toId);const [x]=data.destinations.splice(a,1);data.destinations.splice(b,0,x);data.transfers=data.destinations.slice(0,-1).map((d,i)=>data.transfers[i]||{});save();render()}
async function geocodePlace(name){
  if(!window.google?.maps) throw Error('google_not_loaded');
  try{
    const lib=await google.maps.importLibrary('geocoding');
    const geocoder=new lib.Geocoder();
    const response=await geocoder.geocode({address:name,region:'JP'});
    const results=response.results||[];
    if(!results.length) throw Error('ZERO_RESULTS');
    const p=results[0].geometry.location;
    return {lat:p.lat(),lng:p.lng(),address:results[0].formatted_address};
  }catch(e){throw e;}
}
function nowHHMM(){const d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
async function addDest(){const name=prompt('行き先名を入力してください');if(!name)return;try{const p=await geocodePlace(name);data.destinations.push({id:Date.now(),name,time:nowHHMM(),note:'',lat:p.lat,lng:p.lng});data.transfers=data.destinations.slice(0,-1).map((d,i)=>data.transfers[i]||{});save();render();if(gmap){gmap.panTo(p);gmap.setZoom(15)}}catch(e){const msg=String(e?.message||e); alert('場所を自動検索できませんでした。\n\nGoogle Cloudで「Geocoding API」を有効にしてください。\nまた、Maps JavaScript APIと同じAPIキーを使用してください。\n\nエラー: '+msg)}}
function editD(id){const d=data.destinations.find(x=>x.id===id);if(!d)return;const name=prompt('行き先名',d.name);if(name!==null&&name.trim())d.name=name.trim();const time=prompt('時刻（空欄可）',d.time||'');if(time!==null)d.time=time;const note=prompt('メモ',d.note||'');if(note!==null)d.note=note;save();render();renderMapMarkers()}
function delD(id){if(!confirm('この行き先を削除しますか？'))return;const i=data.destinations.findIndex(x=>x.id===id);data.destinations.splice(i,1);data.transfers=(data.transfers||[]).slice(0,Math.max(0,data.destinations.length-1));save();render();renderMapMarkers()}
function toggleTransfers(){data.showTransfers=!data.showTransfers;save();render()}
function toggleSettings(){$('settings').classList.toggle('hidden');$('setTitle').value=data.title;$('setPw').value=data.password;$('setApi').value=data.apiKey||''}
function saveSettings(){data.title=$('setTitle').value||data.title;data.password=$('setPw').value||data.password;data.apiKey=$('setApi').value.trim();save();$('title').textContent=data.title;$('settings').classList.add('hidden');if(data.apiKey){location.reload()}else{$('mapLoading').textContent='設定からGoogle Maps APIキーを入力してください'}}
function resetData(){if(confirm('初期データに戻しますか？')){data=JSON.parse(JSON.stringify(DEFAULT));save();localStorage.removeItem('tripFinalGoogleLoggedIn');location.reload()}}
